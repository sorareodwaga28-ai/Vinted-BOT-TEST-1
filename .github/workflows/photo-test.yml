name: Test reconnaissance photo

on:
  # Lancé automatiquement quand des photos de référence sont ajoutées (comme pour la Fire Red et la Vivid Sulfur)
  push:
    branches: [main]
    paths:
      - "references/**"
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle à tester"
        type: choice
        default: "Vivid Sulfur"
        options:
          - "Vivid Sulfur"
          - "Fire Red"
          - "Infrared"
          - "Black Canvas"
          - "Midnight Navy"
          - "Seafoam"
          - "Canyon Purple"
          - "Craft Olive"
      prix_max:
        description: "Prix max en € (vide = le prix de la paire dans le bot, aucun = tous les prix)"
        required: false
        default: ""
      recherche:
        description: "Texte de recherche Vinted (vide = aucun texte, la photo fait le tri)"
        required: false
        default: ""
      verif:
        description: "Nombre max d'annonces jugées OUI à ouvrir pour chercher l'étiquette (0 = aucune)"
        required: false
        default: "20"
      seuil:
        description: "Seuil de l'étape 1 (vide = 0.84, ou automatique si témoins activés)"
        required: false
        default: ""
      temoins:
        description: "Ajouter des témoins (vraies paires, sans limite de prix) pour calibrer"
        type: choice
        default: "non"
        options: ["non", "oui"]
      pages:
        description: "Nombre de pages Vinted à lire (environ 96 annonces par page)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: photo-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Dossier de photos modifié
        if: github.event_name == 'push'
        run: |
          echo "CHANGES<<EOF" >> $GITHUB_ENV
          git diff --name-only HEAD~1 HEAD -- references >> $GITHUB_ENV || true
          echo "EOF" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.EasyOCR
          key: clip-v2
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch requests pillow easyocr
          python -c "import open_clip, torch, torchvision; print('OK', torch.__version__, torchvision.__version__)"
      - name: Analyser les photos
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODELE: ${{ inputs.modele }}
          PRIX_MAX: ${{ inputs.prix_max }}
          PAGES: ${{ inputs.pages }}
          RECHERCHE: ${{ inputs.recherche }}
          VERIF: ${{ inputs.verif }}
          SEUIL: ${{ inputs.seuil }}
          TEMOINS: ${{ inputs.temoins }}
          HEAD_COMMIT: ${{ toJSON(github.event.head_commit) }}
        run: |
          set -o pipefail
          if ! python photo_test.py 2>&1 | tee log.txt; then
            msg=$(tail -n 15 log.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Erreur du test photo::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-photo
          path: resultats.csv
          if-no-files-found: ignore
