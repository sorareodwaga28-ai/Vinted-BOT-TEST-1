name: Apprentissage (réponses OUI / NON)

on:
  push:
    branches: [main]
    paths:
      - "verdicts/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apprendre
  cancel-in-progress: false

jobs:
  apprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Appliquer les réponses
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python apprendre.py
      - name: Enregistrer
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/a && cp -r references seuils.json /tmp/a/ && mkdir -p /tmp/a/b
          for f in batteries/*/appris.json batteries/*/etat.json; do [ -f "$f" ] && mkdir -p /tmp/a/b/$(dirname $f) && cp $f /tmp/a/b/$f; done
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/a/references . && cp /tmp/a/seuils.json . && cp -r /tmp/a/b/batteries . 2>/dev/null || true
            git add references seuils.json batteries
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "apprentissage : pièges, références et seuils"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 3
          done
          [ $ok = 1 ] || exit 1
      - name: Lancer la manche suivante
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/a_lancer.txt ] || exit 0
          while IFS='|' read -r modele etape; do
            [ -n "$modele" ] && gh workflow run batterie.yml --ref main -f modele="$modele" -f etape="$etape"
          done < /tmp/a_lancer.txt
