name: Apprentissage (réponses OUI / NON)

on:
  push:
    branches: [main]
    paths:
      - "verdicts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apprendre
  cancel-in-progress: false

jobs:
  apprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Appliquer les réponses
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python apprendre.py
      - name: Enregistrer
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/a && cp -r references seuils.json /tmp/a/ && mkdir -p /tmp/a/b
          for f in batteries/*/appris.json; do [ -f "$f" ] && mkdir -p /tmp/a/b/$(dirname $f) && cp $f /tmp/a/b/$f; done
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/a/references . && cp /tmp/a/seuils.json . && cp -r /tmp/a/b/batteries . 2>/dev/null || true
            git add references seuils.json batteries
            git diff --cached --quiet && exit 0
            git commit -q -m "apprentissage : pièges, références et seuils"
            git push -q origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
