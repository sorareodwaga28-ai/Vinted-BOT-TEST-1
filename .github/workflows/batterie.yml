name: Batterie de tests

on:
  push:
    branches: [main]
    paths:
      - "references/**"
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle à tester (nom exact, ex. Midnight Navy)"
        required: true
        default: "Midnight Navy"
      etape:
        description: "Manche (vide = la manche en cours du modèle)"
        type: choice
        default: ""
        options: ["", "V1", "V2", "V3", "V4", "V5"]
      seuil:
        description: "Seuil (vide = seuil appris, sinon 0.84)"
        required: false
        default: ""
      pages:
        description: "Pages Vinted à lire sans texte (environ 96 annonces par page)"
        required: false
        default: "3"

permissions:
  contents: write
  actions: write

# Une file par modèle : plusieurs paires avancent en même temps, sans s'attendre.
concurrency:
  group: batterie-${{ inputs.modele || github.sha }}
  cancel-in-progress: false

jobs:
  # Photos ajoutées : une batterie V1 par NOUVEAU modèle du commit (les modèles déjà en cours ne sont pas relancés)
  repartir:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer une batterie par nouveau modèle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --name-only HEAD~1 HEAD -- references | cut -d/ -f2 | sort -u > /tmp/slugs.txt
          python - <<'PY' > /tmp/modeles.txt
          import re, pathlib
          src = open("photo_test.py", encoding="utf-8").read()
          i = src.index("PRIX = {"); j = src.index("}", i)
          noms = re.findall(r'"([^"]+)"\s*:', src[i:j])
          slug = lambda n: re.sub(r"[^a-z0-9]+", "-", n.lower()).strip("-")
          par = {slug(n): n for n in noms}
          for s in open("/tmp/slugs.txt").read().split():
              if s in par and not pathlib.Path(f"batteries/{s}/etat.json").exists():
                  print(par[s])
          PY
          cat /tmp/modeles.txt
          while read -r m; do
            [ -n "$m" ] && gh workflow run batterie.yml --ref main -f modele="$m" -f etape=V1
          done < /tmp/modeles.txt

  batterie:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.EasyOCR
          key: clip-v2
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch requests pillow easyocr
      - name: Lancer la batterie
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODELE: ${{ inputs.modele }}
          ETAPE: ${{ inputs.etape }}
          SEUIL: ${{ inputs.seuil }}
          PAGES: ${{ inputs.pages }}
        run: python batterie.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          # On n'écrase ni l'état des manches ni l'apprentissage (gérés par « Apprentissage »)
          cp -r batteries /tmp/batteries
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p batteries
            rsync -a --exclude appris.json --exclude etat.json /tmp/batteries/ batteries/
            for f in /tmp/batteries/*/etat.json; do
              d=batteries/$(basename $(dirname $f)); [ -f $d/etat.json ] || cp $f $d/etat.json
            done
            git add batteries
            git diff --cached --quiet && exit 0
            git commit -q -m "batterie de tests : résultats"
            git push -q origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
