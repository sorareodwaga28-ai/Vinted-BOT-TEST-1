name: Surveillance photo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      duree:
        description: "Durée du passage en minutes"
        required: false
        default: "330"

concurrency:
  group: photo-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # V4 (1/11) : 3 bots en même temps, chacun sur sa machine (adresse différente) avec ses propres recherches.
    # Bot 1 : grosse recherche Jordan + Nike (toutes les 3 s) ; bot 2 : Air Max 1 + Patta ; bot 3 : Sacai + Nocta (toutes les 5 s).
    strategy:
      fail-fast: false
      matrix:
        include:
          # 11/11 : la grosse recherche marque est partagée en 3 (1/3 des annonces par bot, PARTAGE_MARQUE) ;
          # chaque bot garde en plus ses mots-clés et laisse aux autres les titres de leurs mots-clés.
          - bot: 1
            recherches: "marque"
            intervalle: "1.5"
            exclure: "air max 1,airmax 1,patta,sacai,nocta"
            ia_jour: "2700"
            ia_nuit: "500"
          - bot: 2
            recherches: "marque,air+max+1,patta"
            intervalle: "1.5"
            exclure: "sacai,nocta"
            ia_jour: "2700"
            ia_nuit: "500"
          - bot: 3
            recherches: "marque,sacai,nocta"
            intervalle: "1.5"
            exclure: "air max 1,airmax 1,patta"
            ia_jour: "2600"
            ia_nuit: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.EasyOCR
          key: clip-v2
      - uses: actions/cache@v4
        with:
          path: cache_pieges
          key: pieges-${{ matrix.bot }}-${{ github.run_id }}
          restore-keys: |
            pieges-${{ matrix.bot }}-
            pieges-
      - name: Préparer git
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch requests pillow easyocr pywebpush
      - name: Surveiller les nouvelles annonces
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}    # 3/11 : notifications du site (clé donnée par Claude)
          IA_MODELE: ${{ vars.IA_MODELE || 'claude-haiku-5-5' }}
          IA_PRESELECTION: ${{ vars.IA_PRESELECTION || '0.70' }}
          IA_CONFIANCE: ${{ vars.IA_CONFIANCE || '70' }}
          IA_MAX_JOUR: ${{ matrix.ia_jour }}    # total des 3 bots = 8000 comme avant
          IA_MAX_NUIT: ${{ matrix.ia_nuit }}
          BOT: ${{ matrix.bot }}
          BOTS: "3"
          PARTAGE_MARQUE: "1"    # 11/11 : recherche marque partagée en 3 entre les bots
          BOT_RECHERCHES: ${{ matrix.recherches }}
          EXCLURE_TITRES: ${{ matrix.exclure }}
          IA_LISSAGE: ${{ vars.IA_LISSAGE || '0' }}
          IA_MAX: ${{ vars.IA_MAX || '40' }}
          IA_MAX_PAIRE_JOUR: "400"    # 2/11 : plafond par paire et par jour (avant budget / nombre de paires, ~117)
          BAISSE_PLANCHER: "0.68"     # 2/11 : paire < 10 vérifications la veille -> seuil -0,02, jamais sous 0,68
          DISCORD_MENTION: ''    # plus de @everyone sur les vertes (Bastien reçoit déjà toutes les alertes, 31/10)
          MODELES: ${{ vars.PHOTO_MODELES || 'Fire Red, Vivid Sulfur, Midnight Navy, Black Canvas, Fear, Frozen Moments, Air Max 1 Limeade, Sacai Vaporwaffle Villain Red, Sacai Vaporwaffle Sesame Blue Void, SB Pine Green, Lightning, Craft Photon Dust, Jordan 1 High Lost and Found, Sacai Vaporwaffle Tour Yellow, Jordan 3 Nina Chanel Abney, Red Cement, Jordan 3 Dark Iris, Jordan 3 Wizards, Jordan 3 Racer Blue, Neon, Jordan 3 Fire Red, Oxidized Green, Jordan 3 J Balvin Rio, Sacai LDWaffle Undercover Yellow, Red Thunder, White Cement, Taupe Haze, A Ma Maniere Phantom, Jordan 3 White Cement Reimagined, Jordan 1 High Hyper Royal, Air Max 1 Watermelon, Air Max 1 Safari Cobblestone, Blank Canvas, Wet Cement, Air Max 1 Anniversary Aqua, Thunder, Nocta Glide White, Rare Air, Shimmer, Bred Reimagined, Air Max 1 Curry, Air Max 1 Patta Waves Noise Aqua, Air Max 1 Patta Waves Monarch, Air Max 1 Patta Waves Rush Maroon, Air Max 1 Patta Waves Black, Air Max 1 Patta Waves White, Craft Olive, Canyon Purple, Seafoam, Infrared, Air Max 1 Lemonade' }}
          PRIX: ${{ vars.PHOTO_PRIX || 'Fire Red=45; Vivid Sulfur=30; Midnight Navy=40; Black Canvas=70; Fear=50; Frozen Moments=60; Air Max 1 Limeade=60; Sacai Vaporwaffle Villain Red=70; Sacai Vaporwaffle Sesame Blue Void=70; SB Pine Green=50; Lightning=50; Craft Photon Dust=40; Jordan 1 High Lost and Found=60; Sacai Vaporwaffle Tour Yellow=70; Jordan 3 Nina Chanel Abney=60; Red Cement=60; Jordan 3 Dark Iris=45; Jordan 3 Wizards=45; Jordan 3 Racer Blue=45; Neon=50; Jordan 3 Fire Red=45; Oxidized Green=30; Jordan 3 J Balvin Rio=70; Sacai LDWaffle Undercover Yellow=70; Red Thunder=50; White Cement=35; Taupe Haze=60; A Ma Maniere Phantom=70; Jordan 3 White Cement Reimagined=35; Jordan 1 High Hyper Royal=40; Air Max 1 Watermelon=70; Air Max 1 Safari Cobblestone=70; Blank Canvas=70; Wet Cement=50; Air Max 1 Anniversary Aqua=80; Thunder=45; Nocta Glide White=50; Rare Air=60; Shimmer=40; Bred Reimagined=40; Air Max 1 Curry=70; Air Max 1 Patta Waves Noise Aqua=70; Air Max 1 Patta Waves Monarch=70; Air Max 1 Patta Waves Rush Maroon=60; Air Max 1 Patta Waves Black=70; Air Max 1 Patta Waves White=70; Craft Olive=40; Canyon Purple=40; Seafoam=40; Infrared=40; Air Max 1 Lemonade=60' }}
          PRIX_SANS_BOITE: "Fire Red=30; Vivid Sulfur=20; Midnight Navy=30; Black Canvas=50; Fear=30; Frozen Moments=40; SB Pine Green=40; Lightning=40; Craft Photon Dust=30; Craft Olive=30; Red Cement=35; Neon=35; Oxidized Green=20; Red Thunder=40; White Cement=25; Taupe Haze=50; A Ma Maniere Phantom=50; Blank Canvas=50; Wet Cement=40; Thunder=25; Rare Air=50; Shimmer=30; Bred Reimagined=30; Canyon Purple=20; Seafoam=30; Infrared=30; Jordan 3 Nina Chanel Abney=45; Jordan 3 Dark Iris=35; Jordan 3 Wizards=35; Jordan 3 Racer Blue=35; Jordan 3 Fire Red=35; Jordan 3 J Balvin Rio=50; Jordan 3 White Cement Reimagined=25; Jordan 1 High Lost and Found=40; Jordan 1 High Hyper Royal=20; Air Max 1 Limeade=45; Air Max 1 Watermelon=50; Air Max 1 Safari Cobblestone=50; Air Max 1 Anniversary Aqua=60; Air Max 1 Curry=50; Air Max 1 Lemonade=45; Air Max 1 Patta Waves Noise Aqua=50; Air Max 1 Patta Waves Monarch=50; Air Max 1 Patta Waves Rush Maroon=40; Air Max 1 Patta Waves Black=50; Air Max 1 Patta Waves White=50; Sacai Vaporwaffle Villain Red=50; Sacai Vaporwaffle Sesame Blue Void=50; Sacai Vaporwaffle Tour Yellow=50; Sacai LDWaffle Undercover Yellow=60; Nocta Glide White=25"    # 2/11 : prix max sans boîte d'origine (PRIX = avec boîte)
          TAILLE_MIN: ${{ vars.TAILLE_MIN || '40' }}
          TAILLE_MAX: ${{ vars.TAILLE_MAX || '46' }}
          SEUIL: ${{ vars.PHOTO_SEUIL || '0.84' }}
          INTERVALLE: ${{ matrix.intervalle }}    # 11/11 : 1,5 s pour les 3 bots ; V4 : 3 s / 5 s ; V3 : 10 s
          DUREE: ${{ inputs.duree || '330' }}
          GIT_SAVE: "1"
        run: |
          set -o pipefail
          if ! python photo_watch.py 2>&1 | tee log.txt; then
            msg=$(tail -n 15 log.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Erreur surveillance photo::$msg"
            exit 1
          fi
      - name: Sauvegarder les annonces vues
        if: always()
        run: |
          F=photo_seen.json
          [ "${{ matrix.bot }}" = "1" ] || F=photo_seen_${{ matrix.bot }}.json
          [ -f "$F" ] || exit 0
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          cp "$F" /tmp/etat_bot.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/etat_bot.json "$F"
            git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "maj annonces vues (photo)"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
      - name: Lancer le passage suivant
        if: always() && matrix.bot == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run photo-watch.yml --ref main -R "$GITHUB_REPOSITORY" || true
