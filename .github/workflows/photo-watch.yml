name: Surveillance photo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      duree:
        description: "Durée du passage en minutes"
        required: false
        default: "330"

concurrency:
  group: photo-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.EasyOCR
          key: clip-v2
      - name: Préparer git
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch requests pillow easyocr
      - name: Surveiller les nouvelles annonces
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IA_MODELE: ${{ vars.IA_MODELE || 'claude-haiku-5-5' }}
          IA_PRESELECTION: ${{ vars.IA_PRESELECTION || '0.70' }}
          IA_CONFIANCE: ${{ vars.IA_CONFIANCE || '70' }}
          IA_MAX_JOUR: ${{ vars.IA_MAX_JOUR || '3000' }}
          IA_LISSAGE: ${{ vars.IA_LISSAGE || '0' }}
          IA_MAX: ${{ vars.IA_MAX || '40' }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '@everyone' }}
          MODELES: ${{ vars.PHOTO_MODELES || 'Fire Red, Vivid Sulfur, Midnight Navy, Black Canvas, Fear, Frozen Moments, Air Max 1 Limeade, Sacai Vaporwaffle Villain Red, Sacai Vaporwaffle Sesame Blue Void, SB Pine Green, Lightning, Craft Photon Dust, Jordan 1 High Lost and Found, Air Max 1 Watermelon, Air Max 1 Safari Cobblestone, Blank Canvas, Wet Cement, Air Max 1 Anniversary Aqua, Thunder, Nocta Glide White, Rare Air, Shimmer, Bred Reimagined, Air Max 1 Curry, Air Max 1 Patta Waves Noise Aqua' }}
          PRIX: ${{ vars.PHOTO_PRIX || 'Fire Red=60; Vivid Sulfur=30; Midnight Navy=40; Black Canvas=40; Fear=50; Frozen Moments=60; Air Max 1 Limeade=40; Sacai Vaporwaffle Villain Red=70; Sacai Vaporwaffle Sesame Blue Void=50; SB Pine Green=60; Lightning=50; Craft Photon Dust=60; Jordan 1 High Lost and Found=60; Air Max 1 Watermelon=50; Air Max 1 Safari Cobblestone=40; Blank Canvas=50; Wet Cement=60; Air Max 1 Anniversary Aqua=50; Thunder=60; Nocta Glide White=50; Rare Air=50; Shimmer=40; Bred Reimagined=40; Air Max 1 Curry=40; Air Max 1 Patta Waves Noise Aqua=60' }}
          SEUIL: ${{ vars.PHOTO_SEUIL || '0.84' }}
          INTERVALLE: ${{ vars.PHOTO_INTERVALLE || '45' }}
          DUREE: ${{ inputs.duree || '330' }}
          GIT_SAVE: "1"
        run: |
          set -o pipefail
          if ! python photo_watch.py 2>&1 | tee log.txt; then
            msg=$(tail -n 15 log.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Erreur surveillance photo::$msg"
            exit 1
          fi
      - name: Sauvegarder les annonces vues
        if: always()
        run: |
          [ -f photo_seen.json ] || exit 0
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          cp photo_seen.json /tmp/photo_seen.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/photo_seen.json photo_seen.json
            git add photo_seen.json
            git diff --cached --quiet && exit 0
            git commit -q -m "maj annonces vues (photo)"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
      - name: Lancer le passage suivant
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run photo-watch.yml --ref main -R "$GITHUB_REPOSITORY" || true
