name: Vinted alertes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: vinted
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SEARCH_URLS: ${{ secrets.SEARCH_URLS }}
          EXCLUDE: ${{ secrets.EXCLUDE }}
        run: python bot.py
      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "maj annonces vues" && git push)
