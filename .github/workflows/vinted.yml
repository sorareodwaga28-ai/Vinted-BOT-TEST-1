name: Vinted alertes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vinted
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SEARCH_URLS: ${{ secrets.SEARCH_URLS }}
          EXCLUDE: ${{ secrets.EXCLUDE }}
        run: python bot.py
      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          cp seen.json /tmp/mine.json
          cp stats.json /tmp/stats.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git show origin/main:seen.json > /tmp/theirs.json 2>/dev/null || echo '{"ids":[],"searches":[]}' > /tmp/theirs.json
            python - <<'EOF'
          import json
          def load(p):
              d = json.load(open(p))
              return {"ids": d, "searches": []} if isinstance(d, list) else d
          a, b = load("/tmp/theirs.json"), load("/tmp/mine.json")
          # Annonces déjà traitées : union complète, jamais raccourcie (une annonce envoyée ne revient pas)
          al = lambda d: d.get("alertes", d.get("ids", []))
          alertes = list(dict.fromkeys(al(a) + al(b)))
          searches = sorted(set(a.get("searches") or []) | set(b.get("searches") or []))
          max_id = max(int(a.get("max_id") or 0), int(b.get("max_id") or 0))
          json.dump({"alertes": alertes, "searches": searches, "max_id": max_id}, open("seen.json", "w"))
          EOF
            [ -f /tmp/stats.json ] && cp /tmp/stats.json stats.json
            if [ -f /tmp/alertes_titre.json ]; then
              python - <<'EOF'
          import json, os
          liste = json.load(open("alertes.json")) if os.path.exists("alertes.json") else []
          ids = {a.get("id") for a in liste}
          nouv = [a for a in json.load(open("/tmp/alertes_titre.json")) if a["id"] not in ids]
          json.dump((nouv[::-1] + liste)[:300], open("alertes.json", "w"), ensure_ascii=False, indent=1)
          EOF
              git add alertes.json
            fi
            git add seen.json
            [ -f stats.json ] && git add stats.json
            git diff --cached --quiet && exit 0
            git commit -q -m "maj annonces vues"
            git push -q origin HEAD:main && exit 0
            echo "Push refusé, nouvel essai ($i)..."
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
