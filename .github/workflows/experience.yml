name: Expérience classifieur

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle"
        default: "Midnight Navy"

permissions:
  contents: read

jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.EasyOCR
          key: clip-v2
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch requests pillow easyocr scikit-learn
      - env:
          MODELE: ${{ inputs.modele }}
        run: python experience.py
