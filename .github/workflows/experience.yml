name: Expérience classifieur

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle"
        default: "Midnight Navy"

permissions:
  contents: write

jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.EasyOCR
          key: clip-v2
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch requests pillow easyocr scikit-learn
      - env:
          MODELE: ${{ inputs.modele }}
        run: |
          mkdir -p experiences
          python experience.py 2>&1 | grep -v "^[0-9]*/[0-9]*$" | tee "experiences/${MODELE// /-}.txt"
          git config user.name "vinted-bot"; git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --soft origin/main
            git add experiences && git commit -q -m "résultat expérience" && git push -q origin HEAD:main && break
            sleep 3
          done
